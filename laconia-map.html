<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laconia Shops Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{--bg:#fff;--fg:#1c2733;--muted:#66727f;--accent:#0a6cff;--card:#fff;--line:#e2e6ea}
  @media (prefers-color-scheme:dark){:root{--bg:#141a20;--fg:#eef2f6;--muted:#9aa7b4;--card:#1d252d;--line:#2c3742}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  #app{display:flex;flex-direction:column;height:100%}
  header{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--card);border-bottom:1px solid var(--line);z-index:1000}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  h1{font-size:16px;margin:0 8px 6px 0}
  button{font:inherit;cursor:pointer}
  .chip{border:1px solid var(--line);background:var(--card);color:var(--fg);padding:6px 12px;border-radius:999px;font-size:14px}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #search{flex:1;min-width:140px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
  #status{font-size:12px;color:var(--muted);margin-top:4px}
  #map{flex:1;min-height:0}
  .pin{font-size:22px;line-height:1;text-shadow:0 1px 3px rgba(0,0,0,.5)}
  .me{width:18px;height:18px;border-radius:50%;background:#0a6cff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(10,108,255,.25)}
  #total{margin-left:auto;font-size:13px;color:var(--muted)}
  /* the pop-up window */
  #sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:2000}
  #sheetWrap.open{display:flex}
  #sheet{background:var(--card);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.3)}
  @media (min-width:600px){#sheetWrap{align-items:center}#sheet{border-radius:18px}}
  #sheet h2{margin:0 0 2px;font-size:19px}
  #sheet .sub{color:var(--muted);font-size:14px;margin-bottom:14px}
  .big{display:block;width:100%;padding:13px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:16px;text-align:left}
  .big.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stars{display:flex;justify-content:center;gap:6px;font-size:38px;margin:10px 0}
  .stars span{cursor:pointer;color:#c9d0d7}.stars span.on{color:#f5b301}
  .amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .amts button{padding:14px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:17px}
  .amts button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .custom{display:flex;gap:8px}.custom input{flex:1;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit}
  .back{background:none;border:none;color:var(--accent);padding:0;margin-bottom:8px;font-size:14px}
  .note{font-size:13px;color:var(--muted);text-align:center;margin-top:6px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row"><h1>📍 Laconia Shops</h1>
      <button class="chip on" data-v="all">All</button>
      <button class="chip" data-v="skala">Skala</button>
      <button class="chip" data-v="agios">Agios Georgios</button>
      <button class="chip" data-v="vlach">Vlachioti</button>
      <button class="chip" id="gpsBtn">📡 My location</button>
      <span id="total"></span>
    </div>
    <div class="row" style="margin-top:6px"><input id="search" placeholder="Search a shop…"></div>
    <div id="status">Loading map…</div>
  </header>
  <div id="map"></div>
</div>

<div id="sheetWrap"><div id="sheet"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- Villages (fallback centers used if geocoding fails) ----------
const VILLAGES = {
  skala:{name:"Skala Lakonias",q:"Skala, Laconia, Greece",fb:[36.8585,22.7005]},
  agios:{name:"Agios Georgios Lakonias",q:"Agios Georgios, Laconia, Greece",fb:[36.8410,22.7180]},
  vlach:{name:"Vlachioti Lakonias",q:"Vlachioti, Laconia, Greece",fb:[36.8340,22.6650]}
};
const RADIUS = 1500; // metres around each village centre

const $ = s => document.querySelector(s);
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let ratings = store.get("ratings",{});
let money = store.get("money",{});   // {shopId:[{amt,t}]}

const map = L.map("map",{zoomControl:true}).setView([36.85,22.7],13);
// OpenStreetMap's own tile server blocks pages opened from a file (no Referer), so use other providers
// Primary: OpenStreetMap (needs the page to be served from a real web address, e.g. GitHub Pages)
const osmTiles=L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{
  maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
const cartoTiles=L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{
  subdomains:"abcd",maxZoom:19,attribution:"© OpenStreetMap contributors © CARTO"});
const esriTiles=L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",{
  maxZoom:19,attribution:"Tiles © Esri"});
let tileErrors=0,stage=0;
function nextProvider(){
  stage++;tileErrors=0;
  if(stage===1){map.removeLayer(osmTiles);cartoTiles.addTo(map)}
  else if(stage===2){map.removeLayer(cartoTiles);esriTiles.addTo(map)}
}
osmTiles.on("tileerror",()=>{if(stage===0&&++tileErrors>4)nextProvider()});
cartoTiles.on("tileerror",()=>{if(stage===1&&++tileErrors>4)nextProvider()});

let shops = [], markers = {}, layer = L.layerGroup().addTo(map), centers = {}, current = "all";

const ICONS = {shop:"🛍️",supermarket:"🛒",convenience:"🏪",bakery:"🥖",butcher:"🥩",restaurant:"🍽️",cafe:"☕",bar:"🍸",pub:"🍺",fast_food:"🍔",pharmacy:"💊",bank:"🏦",atm:"🏧",fuel:"⛽",hotel:"🏨",guest_house:"🏡",apartment:"🏡",hairdresser:"💇",clothes:"👕",kiosk:"📰",ice_cream:"🍦",greengrocer:"🍎",hardware:"🔧",car_repair:"🚗",florist:"💐",craft:"🛠️"};
function iconFor(t){return ICONS[t.shop]||ICONS[t.amenity]||ICONS[t.tourism]||ICONS.shop}
function kindOf(t){return (t.shop||t.amenity||t.tourism||t.craft||"shop").replace(/_/g," ")}

// ---------- Data loading ----------
async function geocode(v){
  try{
    const u="https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gr&viewbox=22.2,37.1,23.1,36.5&bounded=1&q="+encodeURIComponent(v.q);
    const r=await fetch(u);const j=await r.json();
    if(j[0])return [parseFloat(j[0].lat),parseFloat(j[0].lon)];
  }catch(e){}
  return v.fb;
}
async function loadVillage(key){
  const cacheKey="osm_"+key;
  const cached=store.get(cacheKey,null);
  if(cached&&Date.now()-cached.t<7*864e5){centers[key]=cached.c;return cached.items}
  const c=await geocode(VILLAGES[key]);centers[key]=c;
  const a=`(around:${RADIUS},${c[0]},${c[1]})`;
  const q=`[out:json][timeout:30];(nwr${a}["shop"];nwr${a}["amenity"~"^(restaurant|cafe|bar|pub|fast_food|pharmacy|bank|atm|ice_cream|fuel|marketplace)$"];nwr${a}["tourism"~"^(hotel|guest_house|apartment|hostel)$"];nwr${a}["craft"];);out center tags;`;
  const eps=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
  for(const ep of eps){
    try{
      const r=await fetch(ep,{method:"POST",body:"data="+encodeURIComponent(q)});
      if(!r.ok)continue;
      const j=await r.json();
      const items=j.elements.map(e=>({
        id:e.type[0]+e.id,village:key,
        lat:e.lat??e.center?.lat,lon:e.lon??e.center?.lon,tags:e.tags||{}
      })).filter(s=>s.lat&&s.lon);
      store.set(cacheKey,{t:Date.now(),c,items});
      return items;
    }catch(e){}
  }
  return cached?.items||[];
}

async function init(){
  $("#status").textContent="Finding shops in the three villages…";
  const res=await Promise.all(Object.keys(VILLAGES).map(loadVillage));
  shops=res.flat();
  drawMarkers();
  showVillage("all");
  $("#status").textContent=shops.length?`${shops.length} places found. Tap a pin.`:"No data loaded – check your internet connection and reload.";
  updateTotal();
}

// ---------- Markers ----------
function nameOf(s){return s.tags.name||s.tags["name:en"]||("Unnamed "+kindOf(s.tags))}
function drawMarkers(filter=""){
  layer.clearLayers();markers={};
  const f=filter.trim().toLowerCase();
  shops.forEach(s=>{
    if(current!=="all"&&s.village!==current)return;
    if(f&&!(nameOf(s)+" "+kindOf(s.tags)).toLowerCase().includes(f))return;
    const ic=L.divIcon({className:"",html:`<div class="pin">${iconFor(s.tags)}</div>`,iconSize:[26,26],iconAnchor:[13,13]});
    const m=L.marker([s.lat,s.lon],{icon:ic,title:nameOf(s)}).addTo(layer);
    m.on("click",()=>openSheet(s));
    markers[s.id]=m;
  });
}
function showVillage(k){
  current=k;
  document.querySelectorAll(".chip[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===k));
  drawMarkers($("#search").value);
  if(k==="all"){
    const pts=Object.values(centers);
    if(pts.length)map.fitBounds(L.latLngBounds(pts).pad(0.3));
  }else if(centers[k])map.setView(centers[k],16);
}
document.querySelectorAll(".chip[data-v]").forEach(b=>b.onclick=()=>showVillage(b.dataset.v));
$("#search").oninput=e=>drawMarkers(e.target.value);

// ---------- GPS ----------
let me=null,meMarker=null,watchId=null,routeLine=null;
function startGPS(){
  if(!navigator.geolocation){$("#status").textContent="GPS is not supported on this device.";return}
  if(watchId!==null){if(me)map.setView(me,17);return}
  $("#status").textContent="Getting your location…";
  watchId=navigator.geolocation.watchPosition(p=>{
    me=[p.coords.latitude,p.coords.longitude];
    if(!meMarker){
      meMarker=L.marker(me,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);
      map.setView(me,17);
    }else meMarker.setLatLng(me);
    $("#status").textContent="📡 GPS active";
    $("#gpsBtn").classList.add("on");
    if(routeLine&&routeLine._dest)routeLine.setLatLngs([me,routeLine._dest]);
  },err=>{
    watchId=null;
    $("#status").textContent="GPS error: "+err.message+" (allow location access; use https or a localhost server if it stays blocked)";
  },{enableHighAccuracy:true,maximumAge:3000,timeout:15000});
}
$("#gpsBtn").onclick=startGPS;

// ---------- The pop-up window ----------
const sheetWrap=$("#sheetWrap"),sheet=$("#sheet");
function closeSheet(){sheetWrap.classList.remove("open")}
sheetWrap.addEventListener("click",e=>{if(e.target===sheetWrap)closeSheet()});
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function avg(id){const r=ratings[id];return r?r.score:0}
function totalFor(id){return (money[id]||[]).reduce((a,b)=>a+b.amt,0)}
function updateTotal(){
  const t=Object.values(money).flat().reduce((a,b)=>a+b.amt,0);
  $("#total").textContent=t?`💶 Total: €${t.toFixed(2)}`:"";
}

function openSheet(s,view="main"){
  sheetWrap.classList.add("open");
  const t=s.tags,id=s.id;
  const addr=[t["addr:street"],t["addr:housenumber"]].filter(Boolean).join(" ");
  const head=`<h2>${iconFor(t)} ${esc(nameOf(s))}</h2><div class="sub">${esc(kindOf(t))} · ${VILLAGES[s.village].name}${addr?" · "+esc(addr):""}${t.opening_hours?"<br>🕒 "+esc(t.opening_hours):""}${t.phone?"<br>📞 "+esc(t.phone):""}</div>`;

  if(view==="main"){
    const r=avg(id),tot=totalFor(id);
    sheet.innerHTML=head+
      `<button class="big" id="bRate">⭐ Rate this shop ${r?`<span style="float:right">${"★".repeat(r)}${"☆".repeat(5-r)}</span>`:""}</button>
       <button class="big" id="bMoney">💶 How much money they gave you ${tot?`<span style="float:right">€${tot.toFixed(2)}</span>`:""}</button>
       <button class="big primary" id="bDir">🧭 Directions to go there</button>
       <button class="big" id="bClose" style="text-align:center">Close</button>`;
    $("#bRate").onclick=()=>openSheet(s,"rate");
    $("#bMoney").onclick=()=>openSheet(s,"money");
    $("#bDir").onclick=()=>{directions(s);};
    $("#bClose").onclick=closeSheet;
  }
  if(view==="rate"){
    let score=avg(id);
    sheet.innerHTML=`<button class="back" id="bk">← Back</button>${head}
      <div class="stars" id="st">${[1,2,3,4,5].map(n=>`<span data-n="${n}" class="${n<=score?"on":""}">★</span>`).join("")}</div>
      <button class="big primary" id="save" style="text-align:center">Save rating</button>`;
    $("#bk").onclick=()=>openSheet(s);
    $("#st").querySelectorAll("span").forEach(sp=>sp.onclick=()=>{
      score=+sp.dataset.n;
      $("#st").querySelectorAll("span").forEach(x=>x.classList.toggle("on",+x.dataset.n<=score));
    });
    $("#save").onclick=()=>{if(!score)return;ratings[id]={score,name:nameOf(s),t:Date.now()};store.set("ratings",ratings);openSheet(s)};
  }
  if(view==="money"){
    let amt=0;
    const hist=(money[id]||[]).slice(-3).reverse().map(h=>`€${h.amt.toFixed(2)} · ${new Date(h.t).toLocaleDateString()}`).join("<br>");
    sheet.innerHTML=`<button class="back" id="bk">← Back</button>${head}
      <div class="amts">${[1,2,5,10,20,50].map(a=>`<button data-a="${a}">€${a}</button>`).join("")}</div>
      <div class="custom"><input id="cust" type="number" min="0" step="0.5" inputmode="decimal" placeholder="Other amount (€)"></div>
      <button class="big primary" id="save" style="text-align:center">Save amount</button>
      ${hist?`<div class="note">Previous:<br>${hist}</div>`:""}`;
    $("#bk").onclick=()=>openSheet(s);
    sheet.querySelectorAll(".amts button").forEach(b=>b.onclick=()=>{
      amt=+b.dataset.a;$("#cust").value="";
      sheet.querySelectorAll(".amts button").forEach(x=>x.classList.toggle("on",x===b));
    });
    $("#cust").oninput=e=>{amt=parseFloat(e.target.value)||0;sheet.querySelectorAll(".amts button").forEach(x=>x.classList.remove("on"))};
    $("#save").onclick=()=>{
      if(amt<=0)return;
      (money[id]=money[id]||[]).push({amt,t:Date.now(),name:nameOf(s)});
      store.set("money",money);updateTotal();openSheet(s);
    };
  }
}

function directions(s){
  closeSheet();
  if(!me)startGPS();
  // draw an in-app guide line
  if(routeLine)map.removeLayer(routeLine);
  const dest=[s.lat,s.lon];
  routeLine=L.polyline(me?[me,dest]:[dest],{color:"#0a6cff",weight:4,dashArray:"8 8"}).addTo(map);
  routeLine._dest=dest;
  map.fitBounds(L.latLngBounds(me?[me,dest]:[dest,dest]).pad(0.3),{maxZoom:18});
  // full turn-by-turn in Google Maps (starts from your current position)
  const url=`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=walking`;
  window.open(url,"_blank");
}

init();
</script>
</body>
</html>
