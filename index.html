<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laconia Shops Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.min.css">
<style>
  :root{--bg:#f6f8fa;--fg:#1c2733;--muted:#66727f;--accent:#0a6cff;--card:#fff;--line:#e2e6ea}
  @media (prefers-color-scheme:dark){:root{--bg:#141a20;--fg:#eef2f6;--muted:#9aa7b4;--card:#1d252d;--line:#2c3742}}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--fg)}
  #app{display:flex;flex-direction:column;height:100%}
  header{padding:8px 10px;padding-top:calc(8px + env(safe-area-inset-top,0px));background:var(--card);border-bottom:1px solid var(--line);z-index:1000}
  .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px}
  .row:last-of-type{margin-bottom:0}
  h1{font-size:16px;margin:0;flex:1}
  button{font:inherit;cursor:pointer;color:var(--fg)}
  .chip{border:1px solid var(--line);background:var(--card);padding:5px 11px;border-radius:999px;font-size:13px;white-space:nowrap}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chip.off{opacity:.45}
  #search{flex:1;min-width:120px;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;font-size:14px}
  #status{font-size:12px;color:var(--muted);margin-top:4px}
  #map{flex:1;min-height:0}
  .pin{width:30px;height:30px;border-radius:50%;background:var(--c,#555);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 2px 5px rgba(0,0,0,.45)}
  .me{width:18px;height:18px;border-radius:50%;background:#0a6cff;border:3px solid #fff;box-shadow:0 0 0 6px rgba(10,108,255,.25)}
  #clearRoute{display:none}
  /* pop-up window */
  #sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:2000}
  #sheetWrap.open{display:flex}
  #sheet{background:var(--card);width:100%;max-width:480px;max-height:88%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 30px rgba(0,0,0,.3)}
  @media (min-width:600px){#sheetWrap{align-items:center}#sheet{border-radius:18px}}
  #sheet h2{margin:0 0 2px;font-size:19px}
  #sheet .sub{color:var(--muted);font-size:14px;margin-bottom:14px;line-height:1.5}
  .big{display:block;width:100%;padding:13px;margin:8px 0;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;text-align:left}
  .big.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .big.danger{color:#d1242f}
  .big.c{text-align:center}
  .stars{display:flex;justify-content:center;gap:6px;font-size:40px;margin:10px 0}
  .stars span{cursor:pointer;color:#c9d0d7}.stars span.on{color:#f5b301}
  .amts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
  .amts button{padding:14px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:17px}
  .amts button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  input.f,select.f{width:100%;padding:11px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;margin:6px 0}
  .back{background:none;border:none;color:var(--accent);padding:0;margin-bottom:8px;font-size:14px}
  .note{font-size:13px;color:var(--muted);text-align:center;margin-top:8px;line-height:1.5}
  .li{display:flex;justify-content:space-between;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;font-size:15px}
  .li small{color:var(--muted);white-space:nowrap}
  .tot{font-size:26px;font-weight:700;text-align:center;margin:6px 0 12px}
  .leaflet-container{font:inherit}
</style>
</head>

  <div id="map"></div>

function dist(a,b){const R=6371000,r=Math.PI/180,dLat=(b[0]-a[0])*r,dLon=(b[1]-a[1])*r;
  const x=Math.sin(dLat/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x))}

function nextTiles(){stage++;tileErr=0;if(stage===1){map.removeLayer(osmTiles);cartoTiles.addTo(map)}else if(stage===2){map.removeLayer(cartoTiles);esriTiles.addTo(map)}}
osmTiles.on("tileerror",()=>{if(stage===0&&++tileErr>4)nextTiles()});

  if(tg.shop)return "shop";
  if(tg.craft||tg.office)return "services";
  if(tg.amenity)return "other";
  return "other";
}
function subOf(tg){return tg.shop||tg.amenity||tg.tourism||tg.craft||tg.office||""}
function iconOf(tg){return ICONS[subOf(tg)]||CATS[catOf(tg)].icon}
function nameOf(s){return s.tags.name||s.tags["name:en"]||s.tags.brand||s.tags.operator||((subOf(s.tags)||CATS[catOf(s.tags)].en).replace(/_/g," "))}

let moved=LS.get("moved",{}), dirShops=[];
const norm=x=>String(x||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ς/g,"σ");
function offsetPos(c,i){const a=i*2.4,r=50+45*Math.sqrt(i),k=Math.cos(c[0]*Math.PI/180);return[c[0]+r*Math.cos(a)/111000,c[1]+r*Math.sin(a)/(111000*k)]}
function buildDirShops(){
  dirShops=[];const used=new Set(),cnt={};
  DIRECTORY.forEach((d,i)=>{
    const c=centers[d.village]||VILLAGES[d.village].fb;
    const kk=cnt[d.village]=(cnt[d.village]||0)+1;const pos=d.lat?[d.lat,d.lon]:offsetPos(c,kk);
    const keys=(d.match||[]).map(norm);
    const hit=osmShops.find(o=>!used.has(o.id)&&keys.some(k=>norm(o.tags.name).includes(k))&&dist([o.lat,o.lon],pos)<1500);
    if(hit){used.add(hit.id);if(!hit.tags.phone)hit.tags.phone=d.phone;return}   // already on the map: just add the phone number
    dirShops.push({id:"d"+i,dir:true,approx:!d.lat,v:d.village,lat:pos[0],lon:pos[1],tags:Object.assign({name:d.name,phone:d.phone,"addr:street":d.addr||""},d.tags)});
  });
  applyMoved();
}
function applyMoved(){osmShops.concat(dirShops,userShops).forEach(s=>{const m=moved[s.id];if(m){s.lat=m[0];s.lon=m[1];s.approx=false}})}
const all=()=>osmShops.concat(dirShops,userShops);

async function geocode(v){
  if(v.fixed)return v.fb;
  try{const r=await fetch("https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=gr&viewbox=22.2,37.1,23.1,36.5&bounded=1&q="+encodeURIComponent(v.q));
    const j=await r.json();if(j[0])return[parseFloat(j[0].lat),parseFloat(j[0].lon)]}catch(e){}
  return v.fb;
}
async function loadVillage(key){
  const ck="osm5_"+key,cached=LS.get(ck,null);
  if(cached&&Date.now()-cached.t<3*864e5){centers[key]=cached.c;return cached.items}
  const c=await geocode(VILLAGES[key]);centers[key]=c;
  const a=`(around:${RADIUS},${c[0]},${c[1]})`;
  const q=`[out:json][timeout:40];(nwr${a}["shop"];nwr${a}["craft"];nwr${a}["office"~"^(estate_agent|insurance|travel_agent|lawyer|accountant|company)$"];`+
    `nwr${a}["amenity"~"^(${FOOD_AM.concat(SERV_AM).join("|")}|marketplace)$"];nwr${a}["tourism"~"^(hotel|guest_house|apartment|hostel|motel|camp_site|museum)$"];);out center tags;`;
  const eps=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter","https://overpass.private.coffee/api/interpreter"];
  for(let round=0;round<2;round++){
    for(const ep of eps){
      const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),35000);
      try{
        const r=await fetch(ep,{method:"POST",body:"data="+encodeURIComponent(q),signal:ctl.signal});
        clearTimeout(to);
        if(!r.ok){await new Promise(z=>setTimeout(z,1500));continue}
        const j=await r.json();
        const items=j.elements.map(e=>({id:e.type[0]+e.id,lat:e.lat??(e.center&&e.center.lat),lon:e.lon??(e.center&&e.center.lon),tags:e.tags||{}})).filter(s=>s.lat&&s.lon);
        LS.set(ck,{t:Date.now(),c,items});return items;
      }catch(e){clearTimeout(to)}
    }
  }
  failed.push(key);
  const old=LS.get("osm2_"+key,null);           // last resort: data saved by the previous version
  return cached?cached.items:(old&&key!=="skala"?old.items:[]);
}

function buildHeader(){

  $("#langBtn").textContent=lang==="en"?"🇬🇷 Ελληνικά":"🇬🇧 English";
  $("#search").placeholder=t("search");
  $("#gpsBtn").textContent=t("gps");$("#addBtn").textContent=t("add");$("#listBtn").textContent=t("list");
  $("#walletBtn").textContent=t("wallet")+(totalMoney()?` €${totalMoney().toFixed(0)}`:"");
  $("#clearRoute").textContent=t("clearRoute");
  $("#villages").innerHTML=`<button class="chip ${currentV==="all"?"on":""}" data-v="all">${t("all")}</button>`+
    Object.keys(VILLAGES).map(k=>`<button class="chip ${currentV===k?"on":""}" data-v="${k}">${VILLAGES[k][lang]}</button>`).join("");
  $("#cats").innerHTML=Object.keys(CATS).map(k=>`<button class="chip ${hiddenCats.has(k)?"off":"on"}" data-c="${k}" style="${hiddenCats.has(k)?"":"background:"+CATS[k].color+";border-color:"+CATS[k].color}">${CATS[k].icon} ${CATS[k][lang]}</button>`).join("");
  document.querySelectorAll("[data-v]").forEach(b=>b.onclick=()=>showVillage(b.dataset.v));
  document.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const c=b.dataset.c;hiddenCats.has(c)?hiddenCats.delete(c):hiddenCats.add(c);LS.set("hiddenCats",[...hiddenCats]);buildHeader();drawMarkers()});
}
$("#langBtn").onclick=()=>{lang=lang==="en"?"el":"en";LS.set("lang",lang);buildHeader();drawMarkers();setStatus()};
function setStatus(msg){$("#status").textContent=msg||(all().length?`${all().length} ${t("found")}`:"")}

/* =================== markers =================== */
function visible(){
  const f=$("#search").value.trim().toLowerCase();
  return all().filter(s=>{
    s.v=s.v||nearestVillage(s.lat,s.lon);
    if(currentV!=="all"&&s.v!==currentV)return false;
    if(hiddenCats.has(catOf(s.tags)))return false;
    if(f&&!(nameOf(s)+" "+subOf(s.tags)).toLowerCase().includes(f))return false;
    return true;
  });
}
function drawMarkers(){
  layer.clearLayers();
  visible().forEach(s=>{
    const c=CATS[catOf(s.tags)];
    const m=L.marker([s.lat,s.lon],{title:nameOf(s),icon:L.divIcon({className:"",html:`<div class="pin" style="--c:${c.color}">${iconOf(s.tags)}</div>`,iconSize:[30,30],iconAnchor:[15,15]})});
    m.on("click",()=>{try{openShop(s)}catch(err){setStatus("⚠️ "+err.message)}});layer.addLayer(m);
  });
}
function showVillage(k){
  currentV=k;buildHeader();drawMarkers();
  if(k==="all"){const p=Object.values(centers);if(p.length)map.fitBounds(L.latLngBounds(p).pad(0.35))}
  else if(centers[k])map.setView(centers[k],16);
}
$("#search").oninput=drawMarkers;

/* =================== GPS =================== */
let meMarker=null,watchId=null;
function startGPS(){
  if(!navigator.geolocation){setStatus("GPS not supported");return}
  if(watchId!==null){if(me)map.setView(me,17);return}
  setStatus(t("gpsWait"));
  watchId=navigator.geolocation.watchPosition(p=>{
    me=[p.coords.latitude,p.coords.longitude];
    if(!meMarker){meMarker=L.marker(me,{icon:L.divIcon({className:"",html:'<div class="me"></div>',iconSize:[18,18],iconAnchor:[9,9]}),zIndexOffset:1000}).addTo(map);map.setView(me,17)}
    else meMarker.setLatLng(me);
    $("#gpsBtn").classList.add("on");setStatus(t("gpsOn"));
  },err=>{watchId=null;setStatus(t("gpsErr")+err.message)},{enableHighAccuracy:true,maximumAge:3000,timeout:20000});
}
$("#gpsBtn").onclick=startGPS;

const wrap=$("#sheetWrap"),sheet=$("#sheet");
function closeSheet(){wrap.classList.remove("open")}
wrap.addEventListener("click",e=>{if(e.target===wrap)closeSheet()});
function show(html){sheet.innerHTML=html;wrap.classList.add("open");sheet.scrollTop=0}
const totalFor=id=>(money[id]||[]).reduce((a,b)=>a+b.amt,0);
const totalMoney=()=>Object.values(money).flat().reduce((a,b)=>a+b.amt,0);

function head(s){
  const tg=s.tags,addr=[tg["addr:street"],tg["addr:housenumber"]].filter(Boolean).join(" ");
  const d=me?` · ${fmtD(dist(me,[s.lat,s.lon]))} ${t("away")}`:"";
  return `<h2>${iconOf(tg)} ${esc(nameOf(s))}</h2><div class="sub">${esc(CATS[catOf(tg)][lang])}${subOf(tg)?" · "+esc(subOf(tg).replace(/_/g," ")):""} · ${VILLAGES[s.v||nearestVillage(s.lat,s.lon)][lang]}${d}`+
    `${addr?"<br>"+esc(addr):""}${tg.opening_hours?"<br>🕒 "+esc(tg.opening_hours):""}${tg.phone?`<br>📞 <a href="tel:${esc(tg.phone.replace(/[^+\d]/g,""))}">${esc(tg.phone)}</a>`:""}${s.approx?"<br>📍 "+t("approx"):""}${s.user?"<br>✏️ "+t("mine"):""}</div>`;
}

function openShop(s){
  const r=(ratings[s.id]||{}).score||0,tot=totalFor(s.id);
  show(head(s)+
   `<button class="big" id="bRate">${t("rate")} ${r?`<span style="float:right;color:#f5b301">${"★".repeat(r)}${"☆".repeat(5-r)}</span>`:""}</button>`+
   `<button class="big" id="bMoney">${t("money")} ${tot?`<span style="float:right">€${tot.toFixed(2)}</span>`:""}</button>`+
   `<button class="big primary" id="bDir">${t("dir")}</button>`+
   `<button class="big" id="bMove">${t("move")}</button>`+
   (s.user?`<button class="big danger" id="bDel">🗑️ ${t("delete")}</button>`:"")+
   `<button class="big c" id="bClose">${t("close")}</button>`);
  $("#bRate").onclick=()=>rateView(s);$("#bMoney").onclick=()=>moneyView(s);$("#bDir").onclick=()=>dirView(s);$("#bClose").onclick=closeSheet;$("#bMove").onclick=()=>moveMode(s);
  if(s.user)$("#bDel").onclick=()=>{if(confirm(t("confirm"))){userShops=userShops.filter(x=>x.id!==s.id);LS.set("userShops",userShops);closeSheet();drawMarkers();setStatus()}};
}
let moveMk=null;
function moveMode(s){
  closeSheet();if(moveMk)map.removeLayer(moveMk);
  map.setView([s.lat,s.lon],Math.max(map.getZoom(),18));
  moveMk=L.marker([s.lat,s.lon],{draggable:true,zIndexOffset:2000,icon:L.divIcon({className:"",html:`<div class="pin" style="--c:#d1242f">${iconOf(s.tags)}</div>`,iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);
  setStatus(t("moveHint"));
  moveMk.on("dragend",()=>{
    const p=moveMk.getLatLng();
    show(`<h2>${esc(nameOf(s))}</h2><div class="sub">${t("moveHint")}</div><button class="big primary c" id="ok">${t("savePos")}</button><button class="big c" id="no">${t("cancel")}</button>`);
    $("#ok").onclick=()=>{moved[s.id]=[p.lat,p.lng];LS.set("moved",moved);s.lat=p.lat;s.lon=p.lng;s.approx=false;if(s.user)LS.set("userShops",userShops);endMove()};
    $("#no").onclick=endMove;
  });
}
function endMove(){if(moveMk){map.removeLayer(moveMk);moveMk=null}closeSheet();drawMarkers();setStatus()}
function rateView(s){
  let score=(ratings[s.id]||{}).score||0;
  show(`<button class="back" id="bk">${t("back")}</button>`+head(s)+
   `<div class="stars" id="st">${[1,2,3,4,5].map(n=>`<span data-n="${n}" class="${n<=score?"on":""}">★</span>`).join("")}</div>`+
   `<button class="big primary c" id="save">${t("saveRating")}</button>`);
  $("#bk").onclick=()=>openShop(s);
  $("#st").querySelectorAll("span").forEach(sp=>sp.onclick=()=>{score=+sp.dataset.n;$("#st").querySelectorAll("span").forEach(x=>x.classList.toggle("on",+x.dataset.n<=score))});
  $("#save").onclick=()=>{if(!score)return;ratings[s.id]={score,name:nameOf(s),t:Date.now()};LS.set("ratings",ratings);openShop(s)};
}
function moneyView(s){
  let amt=0;
  const hist=(money[s.id]||[]).slice(-4).reverse().map(h=>`€${h.amt.toFixed(2)} · ${new Date(h.t).toLocaleDateString()}`).join("<br>");
  show(`<button class="back" id="bk">${t("back")}</button>`+head(s)+
   `<div class="amts">${[1,2,5,10,20,50].map(a=>`<button data-a="${a}">€${a}</button>`).join("")}</div>`+
   `<input class="f" id="cust" type="number" min="0" step="0.5" inputmode="decimal" placeholder="${t("other")}">`+
   `<button class="big primary c" id="save">${t("saveAmt")}</button>${hist?`<div class="note">${t("prev")}:<br>${hist}</div>`:""}`);
  $("#bk").onclick=()=>openShop(s);
  sheet.querySelectorAll(".amts button").forEach(b=>b.onclick=()=>{amt=+b.dataset.a;$("#cust").value="";sheet.querySelectorAll(".amts button").forEach(x=>x.classList.toggle("on",x===b))});
  $("#cust").oninput=e=>{amt=parseFloat(e.target.value)||0;sheet.querySelectorAll(".amts button").forEach(x=>x.classList.remove("on"))};
  $("#save").onclick=()=>{if(amt<=0)return;(money[s.id]=money[s.id]||[]).push({amt,t:Date.now(),name:nameOf(s)});LS.set("money",money);buildHeader();openShop(s)};
}
function dirView(s){
  const d=me?fmtD(dist(me,[s.lat,s.lon])):null;
  show(`<button class="back" id="bk">${t("back")}</button>`+head(s)+
   (d?`<div class="tot" style="font-size:22px">${t("walk")} · ${d}</div>`:`<div class="note">${t("noGps")}</div>`)+
   `<button class="big primary" id="bRoute">${t("showRoute")}</button>`+
   `<button class="big" id="bG">${t("gmaps")}</button>`);
  $("#bk").onclick=()=>openShop(s);
  $("#bRoute").onclick=()=>{closeSheet();drawRoute(s)};
  $("#bG").onclick=()=>window.open(`https://www.google.com/maps/dir/?api=1&destination=${s.lat},${s.lon}&travelmode=walking`,"_blank");
  if(!me)startGPS();
}
async function drawRoute(s){
  if(!me){startGPS();setStatus(t("noGps"));map.setView([s.lat,s.lon],18);return}
  clearRoute();
  const dest=[s.lat,s.lon];
  routeLayer=L.layerGroup().addTo(map);
  let pts=null,info="";
  try{
    const r=await fetch(`https://routing.openstreetmap.de/routed-foot/route/v1/foot/${me[1]},${me[0]};${s.lon},${s.lat}?overview=full&geometries=geojson`);
    const j=await r.json();
    if(j.routes&&j.routes[0]){pts=j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]);info=`${t("walk")} · ${fmtD(j.routes[0].distance)} · ${Math.max(1,Math.round(j.routes[0].duration/60))} min`}
  }catch(e){}
  if(!pts){pts=[me,dest];info=t("routeFail")}
  L.polyline(pts,{color:"#0a6cff",weight:5,opacity:.85}).addTo(routeLayer);
  map.fitBounds(L.latLngBounds(pts).pad(0.25),{maxZoom:18});
  setStatus(`${nameOf(s)} — ${info}`);
  $("#clearRoute").style.display="inline-block";
}
function clearRoute(){if(routeLayer){map.removeLayer(routeLayer);routeLayer=null}$("#clearRoute").style.display="none";setStatus()}
$("#clearRoute").onclick=clearRoute;

/* =================== Nearby list =================== */
$("#listBtn").onclick=()=>{
  const ref=me||[map.getCenter().lat,map.getCenter().lng];
  const items=visible().map(s=>({s,d:dist(ref,[s.lat,s.lon])})).sort((a,b)=>a.d-b.d).slice(0,60);
  show(`<h2>${t("nearby")}</h2><div class="sub">${items.length}</div>`+
    (items.length?items.map((x,i)=>`<div class="li" data-i="${i}"><span>${iconOf(x.s.tags)} ${esc(nameOf(x.s))}</span><small>${fmtD(x.d)}</small></div>`).join(""):`<div class="note">${t("none")}</div>`)+
    `<button class="big c" id="bClose">${t("close")}</button>`);
  $("#bClose").onclick=closeSheet;
  sheet.querySelectorAll(".li").forEach(el=>el.onclick=()=>{const s=items[+el.dataset.i].s;map.setView([s.lat,s.lon],18);openShop(s)});
};

/* =================== Wallet =================== */
$("#walletBtn").onclick=()=>{
  const rows=Object.values(money).flat().sort((a,b)=>b.t-a.t);
  const byDay={};rows.forEach(r=>{const d=new Date(r.t).toLocaleDateString();byDay[d]=(byDay[d]||0)+r.amt});
  show(`<h2>${t("wallet2")}</h2><div class="tot">€${totalMoney().toFixed(2)}</div>`+
    Object.entries(byDay).map(([d,v])=>`<div class="li"><span>${d}</span><small>€${v.toFixed(2)}</small></div>`).join("")+
    (rows.length?`<div class="note">${t("prev")}</div>`+rows.slice(0,15).map(r=>`<div class="li"><span>${esc(r.name||"")}</span><small>€${r.amt.toFixed(2)}</small></div>`).join(""):`<div class="note">${t("none")}</div>`)+
    (rows.length?`<button class="big danger c" id="bClear">${t("clearAll")}</button>`:"")+`<button class="big c" id="bClose">${t("close")}</button>`);
  $("#bClose").onclick=closeSheet;
  const c=$("#bClear");if(c)c.onclick=()=>{if(confirm(t("confirm"))){money={};LS.set("money",money);buildHeader();closeSheet()}};
};

/* =================== Add your own shop =================== */
$("#addBtn").onclick=()=>{adding=true;setStatus(t("tapMap"));map.getContainer().style.cursor="crosshair"};
map.on("click",e=>{
  if(!adding)return;adding=false;map.getContainer().style.cursor="";setStatus();
  const {lat,lng}=e.latlng;
  show(`<h2>➕ ${t("newShop")}</h2><input class="f" id="nm" placeholder="${t("name")}">`+
    `<select class="f" id="ct">${Object.keys(CATS).map(k=>`<option value="${k}">${CATS[k].icon} ${CATS[k][lang]}</option>`).join("")}</select>`+
    `<button class="big primary c" id="save">${t("save")}</button><button class="big c" id="bClose">${t("close")}</button>`);
  $("#bClose").onclick=closeSheet;
  $("#save").onclick=()=>{
    const name=$("#nm").value.trim();if(!name)return;
    userShops.push({id:"u"+Date.now(),user:true,lat,lon:lng,tags:{name,_cat:$("#ct").value}});
    LS.set("userShops",userShops);closeSheet();drawMarkers();setStatus();
  };
});

/* =================== Start =================== */
async function init(){
  buildHeader();setStatus(t("loading"));
  const seen=new Set();osmShops=[];let n=0;
  for(const key of Object.keys(VILLAGES)){
    setStatus(t("loading")+" ("+(++n)+"/3)");
    const items=await loadVillage(key);
    items.forEach(x=>{if(!seen.has(x.id)){seen.add(x.id);osmShops.push(x)}});
    buildDirShops();
    if(n===1)showVillage("all");else{drawMarkers()}
  }
  showVillage("all");
  if(failed.length){
    const st=$("#status");
    st.textContent="⚠️ "+failed.map(k=>VILLAGES[k][lang]).join(", ")+" – "+t("retry");
    st.style.cursor="pointer";st.style.color="#d1242f";st.onclick=()=>location.reload();
  }else setStatus(all().length?undefined:t("noData"));
}
window.addEventListener("error",e=>{const st=$("#status");if(st)st.textContent="⚠️ "+e.message});
init();
</script>
